trigger:
  batch: true
  branches:
    include:
      - vsc-rel/v*
pr: none

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

parameters:
  - name: CliReleaseTag
    displayName: CLI release tag to bundle in VS Code extension (empty = latest stable)
    type: string
    default: ''
  - name: SkipPublish
    displayName: Skip publishing to VS Code Marketplace
    type: boolean
    default: false
  - name: DoEsrp
    displayName: Sign the language server, VSIX, and publisher manifest (required to publish)
    type: boolean
    default: true

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    settings:
      networkIsolationPolicy: Permissive, CfsClean
    sdl:
      policheck:
        enabled: true
        break: true
        severity: 'Warning'
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows
    stages:
    - stage: Build_Server
      displayName: Build and sign WinUI XAML server
      variables:
      - group: signingIdentity
      jobs:
      - job: BuildServer
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        steps:
          - checkout: self
          - task: UseDotNet@2
            displayName: Setup .NET SDK 10.0
            inputs:
              packageType: sdk
              version: 10.0.x
          - task: UseNode@1
            displayName: Setup Node.js 24
            inputs:
              version: '24.x'
          - task: PowerShell@2
            displayName: Test WinUI XAML language server
            inputs:
              pwsh: true
              errorActionPreference: 'stop'
              targetType: 'inline'
              script: |
                $testProjects = @(
                  "WinUiXaml.Xaml.Tests/WinUiXaml.Xaml.Tests.csproj",
                  "WinUiXaml.Workspace.Tests/WinUiXaml.Workspace.Tests.csproj",
                  "WinUiXaml.LanguageServer.Tests/WinUiXaml.LanguageServer.Tests.csproj"
                )
                foreach ($project in $testProjects) {
                  dotnet test "$(System.DefaultWorkingDirectory)/server/test/$project" -c Release --nologo
                  if ($LASTEXITCODE -ne 0) { Write-Error "WinUI XAML language server tests failed: $project"; exit 1 }
                }
          - task: PowerShell@2
            displayName: Publish framework-dependent WinUI XAML language server
            inputs:
              pwsh: true
              errorActionPreference: 'stop'
              targetType: 'inline'
              script: |
                $env:WINUI_XAML_SERVER_OUTPUT = "$(Build.ArtifactStagingDirectory)/server-bundle"
                node "$(System.DefaultWorkingDirectory)/scripts/ensure-server-bundle.mjs"
                if ($LASTEXITCODE -ne 0) { Write-Error "Server publish failed"; exit 1 }
          - ${{ if eq(parameters.DoEsrp, 'true') }}:
            - task: UseDotNet@2
              displayName: Setup .NET 8.0 (For ESRP Task)
              inputs:
                packageType: runtime
                version: 8.0.x
            - task: EsrpCodeSigning@6
              displayName: Code Sign ESRP - WinUI XAML language server
              inputs:
                ConnectedServiceName: $(SigningServiceName)
                AppRegistrationClientId: $(SigningAppId)
                AppRegistrationTenantId: $(SigningTenantId)
                AuthAKVName: $(SigningAKVName)
                AuthCertName: $(SigningAuthCertName)
                AuthSignCertName: $(SigningSignCertName)
                FolderPath: '$(Build.ArtifactStagingDirectory)/server-bundle'
                Pattern: '**/WinUiXaml*.dll'
                UseMinimatch: true
                signConfigType: inlineSignParams
                inlineOperation: |
                  [
                      {
                          "KeyCode": "CP-230012",
                          "OperationCode": "SigntoolSign",
                          "Parameters": {
                              "OpusName": "Microsoft",
                              "OpusInfo": "https://www.microsoft.com",
                              "FileDigest": "/fd SHA256",
                              "PageHash": "/NPH",
                              "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td SHA256"
                          },
                          "ToolName": "sign",
                          "ToolVersion": "1.0"
                      },
                      {
                          "KeyCode": "CP-230012",
                          "OperationCode": "SigntoolVerify",
                          "Parameters": {},
                          "ToolName": "sign",
                          "ToolVersion": "1.0"
                      }
                  ]
          - task: 1ES.PublishPipelineArtifact@1
            displayName: Upload server artifact
            inputs:
              path: '$(Build.ArtifactStagingDirectory)/server-bundle'
              artifactName: winui-xaml-server

    - stage: Build
      dependsOn: Build_Server
      variables:
      - group: signingIdentity
      jobs:
      - job: Build
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        templateContext:
          inputs:
          - input: pipelineArtifact
            artifactName: winui-xaml-server
            targetPath: $(Pipeline.Workspace)/winui-xaml-server
        steps:
          - checkout: self
          - task: UseNode@1
            displayName: Setup Node.js 24
            inputs:
              version: '24.x'
          - task: UseDotNet@2
            displayName: Setup .NET 10 SDK
            inputs:
              packageType: sdk
              version: 10.0.x
          - task: PowerShell@2
            displayName: Download public CLI release for VS Code extension
            env:
              GH_TOKEN: $(GITHUB_TOKEN)
            inputs:
              pwsh: true
              errorActionPreference: 'stop'
              targetType: 'inline'
              script: |
                $cliReleaseTag = "${{ parameters.CliReleaseTag }}"
                $repo = "microsoft/winappcli"

                if ([string]::IsNullOrWhiteSpace($cliReleaseTag)) {
                    Write-Host "No CLI release tag specified, finding latest stable release..."
                    $releases = gh release list --repo $repo --limit 10 --json tagName,isPrerelease,isDraft | ConvertFrom-Json
                    $stableRelease = $releases | Where-Object { -not $_.isPrerelease -and -not $_.isDraft } | Select-Object -First 1
                    if (-not $stableRelease) {
                        Write-Error "No stable release found for $repo"
                        exit 1
                    }
                    $cliReleaseTag = $stableRelease.tagName
                    Write-Host "Found latest stable release: $cliReleaseTag"
                } else {
                    Write-Host "Using specified CLI release tag: $cliReleaseTag"
                }

                $cliDir = "$(System.DefaultWorkingDirectory)/artifacts/public-cli"
                New-Item -ItemType Directory -Path "$cliDir/win-x64" -Force | Out-Null
                New-Item -ItemType Directory -Path "$cliDir/win-arm64" -Force | Out-Null

                gh release download $cliReleaseTag --repo $repo --pattern "winappcli-x64.zip" --dir $cliDir
                if ($LASTEXITCODE -ne 0) { Write-Error "Failed to download winappcli-x64.zip"; exit 1 }
                gh release download $cliReleaseTag --repo $repo --pattern "winappcli-arm64.zip" --dir $cliDir
                if ($LASTEXITCODE -ne 0) { Write-Error "Failed to download winappcli-arm64.zip"; exit 1 }

                Expand-Archive -Path "$cliDir/winappcli-x64.zip" -DestinationPath "$cliDir/win-x64" -Force
                Expand-Archive -Path "$cliDir/winappcli-arm64.zip" -DestinationPath "$cliDir/win-arm64" -Force

                if (-not (Test-Path "$cliDir/win-x64/winapp.exe")) { Write-Error "x64 winapp.exe not found"; exit 1 }
                if (-not (Test-Path "$cliDir/win-arm64/winapp.exe")) { Write-Error "arm64 winapp.exe not found"; exit 1 }
          - task: PowerShell@2
            displayName: Install signed WinUI XAML server artifact
            inputs:
              pwsh: true
              errorActionPreference: 'stop'
              filePath: $(System.DefaultWorkingDirectory)\scripts\download-server.ps1
              arguments: "-ArtifactPath '$(Pipeline.Workspace)/winui-xaml-server'"
          - task: PowerShell@2
            displayName: Smoke signed framework-dependent WinUI XAML server
            inputs:
              targetType: inline
              pwsh: true
              errorActionPreference: 'stop'
              script: |
                dotnet restore "$(System.DefaultWorkingDirectory)\test\fixtures\xaml\fixture\SmokeFixture.csproj" -p:Platform=x64
                node "$(System.DefaultWorkingDirectory)\scripts\test-framework-dependent-server.mjs"
          - task: PowerShell@2
            displayName: Create temporary .npmrc for Build
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $npmrcContent = "registry=https://pkgs.dev.azure.com/microsoft/pde-oss/_packaging/winapp-npm-feed/npm/registry/`nalways-auth=true"
                Set-Content -Path "$(System.DefaultWorkingDirectory)/.npmrc" -Value $npmrcContent
                Write-Host "Created .npmrc for Azure Artifacts feed"
          - task: npmAuthenticate@0
            displayName: Authenticate with Azure Artifacts feed
            inputs:
              workingFile: '$(System.DefaultWorkingDirectory)/.npmrc'
          - task: PowerShell@2
            displayName: Package VS Code extension with public CLI
            inputs:
              pwsh: true
              filePath: $(System.DefaultWorkingDirectory)\scripts\package-vsc.ps1
              arguments: "-Stable -SkipServerBuild -CliBinariesPath '$(System.DefaultWorkingDirectory)/artifacts/public-cli'"
          - task: PowerShell@2
            displayName: Run E2E tests
            inputs:
              pwsh: true
              targetType: inline
              workingDirectory: '$(System.DefaultWorkingDirectory)'
              script: |
                $vscodeVersion = "1.109.5"
                $vscodeDir = Join-Path "$(Agent.TempDirectory)" "vscode"
                $vscodeZip = Join-Path "$(Agent.TempDirectory)" "vscode.zip"
                Invoke-WebRequest `
                    -Uri "https://update.code.visualstudio.com/$vscodeVersion/win32-x64-archive/stable" `
                    -OutFile $vscodeZip `
                    -UseBasicParsing
                Expand-Archive -Path $vscodeZip -DestinationPath $vscodeDir -Force

                $codePath = Join-Path $vscodeDir "Code.exe"
                if (-not (Test-Path $codePath)) {
                    Write-Error "Downloaded VS Code executable not found at $codePath"
                    exit 1
                }

                $vsix = Get-ChildItem -Path "$(System.DefaultWorkingDirectory)/artifacts" -Filter "winapp-*.vsix" |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 1
                if (-not $vsix) {
                    Write-Error "No packaged VSIX found for E2E testing"
                    exit 1
                }

                & $codePath --user-data-dir "$(Agent.TempDirectory)/vscode-install-profile" `
                    --extensions-dir "$(Agent.TempDirectory)/vscode-extensions" `
                    --install-extension $vsix.FullName --force
                if ($LASTEXITCODE -ne 0) {
                    Write-Error "Failed to install packaged VSIX"
                    exit $LASTEXITCODE
                }

                $env:VSCODE_PATH = $codePath
                $env:E2E_USE_INSTALLED_EXTENSION = "1"
                npm run test:e2e -- --grep-invert "adding empty custom capability|adding invalid format custom capability|adding valid custom capability|custom capability appears in the custom capabilities list|invalid inputFolder|cancelling the artifact QuickPick|selecting Browse|cancelling the certificate QuickPick"
                if ($LASTEXITCODE -ne 0) {
                    Write-Error "E2E tests failed"
                    exit $LASTEXITCODE
                }
          - task: PowerShell@2
            displayName: Stage Playwright diagnostics
            condition: not(canceled())
            inputs:
              pwsh: true
              targetType: inline
              workingDirectory: '$(System.DefaultWorkingDirectory)'
              script: |
                $stage = "$(Build.ArtifactStagingDirectory)/playwright-report"
                New-Item -ItemType Directory -Path $stage -Force | Out-Null
                if (Test-Path "playwright-report") {
                    Copy-Item "playwright-report" "$stage/playwright-report" -Recurse -Force
                }
                if (Test-Path "test-results") {
                    Copy-Item "test-results" "$stage/test-results" -Recurse -Force
                }
          - task: 1ES.PublishPipelineArtifact@1
            displayName: Upload Playwright report
            condition: not(canceled())
            inputs:
              path: '$(Build.ArtifactStagingDirectory)/playwright-report'
              artifactName: playwright-report
          - ${{ if eq(parameters.DoEsrp, 'true') }}:
            - task: EsrpCodeSigning@6
              displayName: Code Sign ESRP - VSIX Package
              inputs:
                ConnectedServiceName: $(SigningServiceName)
                AppRegistrationClientId: $(SigningAppId)
                AppRegistrationTenantId: $(SigningTenantId)
                AuthAKVName: $(SigningAKVName)
                AuthCertName: $(SigningAuthCertName)
                AuthSignCertName: $(SigningSignCertName)
                FolderPath: '$(System.DefaultWorkingDirectory)/artifacts/'
                Pattern: '*.vsix'
                UseMinimatch: true
                signConfigType: inlineSignParams
                inlineOperation: |
                  [
                      {
                          "KeyCode": "CP-401405",
                          "OperationCode": "OpcSign",
                          "Parameters": {
                              "FileDigest": "/fd SHA256"
                          },
                          "ToolName": "sign",
                          "ToolVersion": "1.0"
                      },
                      {
                          "KeyCode": "CP-401405",
                          "OperationCode": "OpcVerify",
                          "Parameters": {},
                          "ToolName": "sign",
                          "ToolVersion": "1.0"
                      }
                  ]
          - ${{ if eq(parameters.DoEsrp, 'true') }}:
            - task: PowerShell@2
              displayName: Generate extension manifest for publisher signing
              inputs:
                pwsh: true
                targetType: inline
                workingDirectory: '$(System.DefaultWorkingDirectory)'
                script: |
                  $artifactsDir = "$(System.DefaultWorkingDirectory)/artifacts"
                  $vsix = Get-ChildItem -Path $artifactsDir -Filter "winapp-*.vsix" |
                      Sort-Object LastWriteTime -Descending | Select-Object -First 1
                  if (-not $vsix) {
                      Write-Error "No VSIX found in $artifactsDir"
                      exit 1
                  }
                  Write-Host "Generating publisher manifest for $($vsix.Name)"
                  # Uses the @vscode/vsce devDependency installed by package-vsc.ps1 (offline, no public registry)
                  npx vsce generate-manifest -i "$($vsix.FullName)" -o "$artifactsDir/extension.manifest"
                  if ($LASTEXITCODE -ne 0) {
                      Write-Error "vsce generate-manifest failed"
                      exit 1
                  }
                  # ESRP signs this file in place to produce the publisher signature
                  Copy-Item "$artifactsDir/extension.manifest" "$artifactsDir/extension.signature.p7s" -Force
                  Write-Host "Created extension.manifest and extension.signature.p7s"
            - task: EsrpCodeSigning@6
              displayName: Code Sign ESRP - VS Code Publisher Signature
              inputs:
                ConnectedServiceName: $(SigningServiceName)
                AppRegistrationClientId: $(SigningAppId)
                AppRegistrationTenantId: $(SigningTenantId)
                AuthAKVName: $(SigningAKVName)
                AuthCertName: $(SigningAuthCertName)
                AuthSignCertName: $(SigningSignCertName)
                FolderPath: '$(System.DefaultWorkingDirectory)/artifacts/'
                Pattern: 'extension.signature.p7s'
                UseMinimatch: true
                signConfigType: inlineSignParams
                inlineOperation: |
                  [
                      {
                          "KeyCode": "CP-401405",
                          "OperationCode": "VSCodePublisherSign",
                          "Parameters": {},
                          "ToolName": "sign",
                          "ToolVersion": "1.0"
                      }
                  ]
          - task: CopyFiles@2
            displayName: Copy Artifacts - VS Code Extension
            inputs:
              sourceFolder: '$(System.DefaultWorkingDirectory)/artifacts/'
              contents: '*.vsix'
              targetFolder: '$(Build.ArtifactStagingDirectory)/vscode-extension'
          - ${{ if eq(parameters.DoEsrp, 'true') }}:
            - task: CopyFiles@2
              displayName: Copy Publisher Signature
              inputs:
                sourceFolder: '$(System.DefaultWorkingDirectory)/artifacts/'
                contents: |
                  extension.manifest
                  extension.signature.p7s
                targetFolder: '$(Build.ArtifactStagingDirectory)/vscode-extension'
          - task: 1ES.PublishPipelineArtifact@1
            displayName: Upload Artifact - VS Code Extension
            inputs:
              path: '$(Build.ArtifactStagingDirectory)/vscode-extension'
              artifactName: vscode-extension

    - stage: Release_VSC
      displayName: Publish VS Code Extension
      dependsOn: Build
      condition: and(succeeded(), eq('${{ parameters.SkipPublish }}', 'false'), eq('${{ parameters.DoEsrp }}', 'true'))
      variables:
      - group: signingIdentity
      jobs:
      - job: publish_vsc_extension
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        displayName: VS Code Marketplace
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            artifactName: vscode-extension
            targetPath: $(Pipeline.Workspace)/vscode-extension
        steps:
          - task: UseNode@1
            displayName: Setup Node.js 24
            inputs:
              version: '24.x'
          - task: PowerShell@2
            displayName: Create temporary .npmrc
            inputs:
              targetType: inline
              script: |
                $npmrcContent = "registry=https://pkgs.dev.azure.com/microsoft/pde-oss/_packaging/winapp-npm-feed/npm/registry/`nalways-auth=true"
                Set-Content -Path ".npmrc" -Value $npmrcContent
                Write-Host "Created .npmrc for Azure Artifacts feed"
          - task: npmAuthenticate@0
            displayName: Authenticate with Azure Artifacts feed
            inputs:
              workingFile: '.npmrc'
          - task: AzureCLI@2
            displayName: Publish to VS Code Marketplace
            inputs:
              azureSubscription: $(SigningServiceName)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                # Install vsce from the authenticated Azure Artifacts feed.
                # The 1ES pool blocks public npmjs egress, so a plain global install
                # falls back to the public registry and fails with EACCES. Pin the
                # registry to the private feed and point npm at the authenticated
                # .npmrc so vsce + its transitive deps resolve through the proxy.
                npm install -g @vscode/vsce@3 \
                  --registry=https://pkgs.dev.azure.com/microsoft/pde-oss/_packaging/winapp-npm-feed/npm/registry/ \
                  --userconfig "$(System.DefaultWorkingDirectory)/.npmrc"

                VSIX=$(find "$(Pipeline.Workspace)/vscode-extension/" -name "*.vsix" | head -1)
                MANIFEST=$(find "$(Pipeline.Workspace)/vscode-extension/" -name "extension.manifest" | head -1)
                SIGNATURE=$(find "$(Pipeline.Workspace)/vscode-extension/" -name "extension.signature.p7s" | head -1)
                if [ -z "$VSIX" ]; then
                  echo "##[error]No VSIX file found in vscode-extension artifact"
                  exit 1
                fi
                if [ -z "$MANIFEST" ] || [ -z "$SIGNATURE" ]; then
                  echo "##[error]No publisher manifest/signature found in vscode-extension artifact"
                  exit 1
                fi

                echo "Publishing $VSIX to VS Code Marketplace with publisher signature..."

                vsce publish --packagePath "$VSIX" --manifestPath "$MANIFEST" --signaturePath "$SIGNATURE" --azure-credential
