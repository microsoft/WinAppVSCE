name: VS Integration Probe

# Throwaway feasibility probe: can GitHub-hosted runners drive a real Visual Studio + WinUI Surface
# through vs-extension\Test-VsIntegration.ps1? Reports the session/desktop environment, then runs the
# smallest integration group. Trigger: `git tag vs-ci-probe-1 && git push origin vs-ci-probe-1`.

on:
  push:
    tags: [ "vs-ci-probe-*" ]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, windows-2022, windows-11-arm ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 130
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Environment probe
      shell: pwsh
      continue-on-error: true
      run: |
        Add-Type @"
        using System; using System.Runtime.InteropServices;
        public static class WS {
          [DllImport("user32.dll")] public static extern IntPtr GetProcessWindowStation();
          [DllImport("user32.dll", SetLastError=true)] public static extern bool GetUserObjectInformation(IntPtr h, int i, ref USEROBJECTFLAGS f, int n, out int needed);
          [StructLayout(LayoutKind.Sequential)] public struct USEROBJECTFLAGS { public int fInherit; public int fReserved; public int dwFlags; }
          [DllImport("dwmapi.dll")] public static extern int DwmIsCompositionEnabled(out bool enabled);
        }
        "@
        $f = New-Object WS+USEROBJECTFLAGS; $n = 0
        [void][WS]::GetUserObjectInformation([WS]::GetProcessWindowStation(), 1, [ref]$f, 12, [ref]$n)
        $dwm = $false; [void][WS]::DwmIsCompositionEnabled([ref]$dwm)
        Add-Type -AssemblyName System.Windows.Forms
        $info = [ordered]@{
          os               = (Get-CimInstance Win32_OperatingSystem).Caption
          arch             = $env:PROCESSOR_ARCHITECTURE
          user             = whoami
          sessionId        = [Diagnostics.Process]::GetCurrentProcess().SessionId
          interactive      = [Environment]::UserInteractive
          winstaVisible    = [bool]($f.dwFlags -band 1)   # WSF_VISIBLE
          dwmComposition   = $dwm
          explorerRunning  = [bool](Get-Process explorer -ErrorAction SilentlyContinue)
          dwmRunning       = [bool](Get-Process dwm -ErrorAction SilentlyContinue)
          screen           = "$([Windows.Forms.Screen]::PrimaryScreen.Bounds)"
        }
        $info | Format-List | Out-Host
        & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -prerelease -format text |
          Select-String '^(displayName|installationVersion|productId|installationPath):' | Out-Host
        query user 2>&1 | Out-Host
        $global:LASTEXITCODE = 0   # `query user` exits 1 even on success
        "## Probe ($env:RUNNER_OS / ${{ matrix.os }})`n``````n$($info | Format-List | Out-String)``````" | Add-Content $env:GITHUB_STEP_SUMMARY

    - name: Screenshot of the runner desktop
      shell: pwsh
      continue-on-error: true
      run: |
        Add-Type -AssemblyName System.Windows.Forms, System.Drawing
        $b = [Windows.Forms.Screen]::PrimaryScreen.Bounds
        $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
        [Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [Drawing.Point]::Empty, $b.Size)
        New-Item -ItemType Directory -Force probe-out | Out-Null
        $bmp.Save("probe-out\desktop.png")

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install npm dependencies
      run: npm ci

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    # Surface's bootstrapper needs the runtime's Main/Singleton/DDLM packages, not just the framework.
    # probe-4: x64 images have framework 2.5.1 but Surface still exits 0x80670016 (no DDLM match).
    # Windows PowerShell: pwsh's Appx module fails on windows-2022.
    - name: Install Windows App Runtime 2.5
      shell: powershell
      run: |
        $list = { Get-AppxPackage -AllUsers | Where-Object Name -match 'WinAppRuntime|WindowsAppRuntime\.2' | ForEach-Object { "$($_.Name) $($_.Version) $($_.Architecture)" } | Sort-Object }
        "Before:"; & $list
        $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
        $exe = "$env:RUNNER_TEMP\wasdk-runtime.exe"
        Invoke-WebRequest "https://aka.ms/windowsappsdk/2.5/latest/windowsappruntimeinstall-$arch.exe" -OutFile $exe -UseBasicParsing
        & $exe --quiet --force; "installer exit: $LASTEXITCODE"
        "After:"; & $list
        exit 0

    # probe-6: the full suite, to measure CI runtime and catch x64/runner-only failures.
    - name: VS integration (full suite)
      id: vsint
      shell: pwsh
      continue-on-error: true
      run: ./vs-extension/Test-VsIntegration.ps1 -TimeoutMinutes 90

    - name: Collect logs
      if: ${{ !cancelled() }}
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force probe-out | Out-Null
        Copy-Item "$env:TEMP\wxp-vs-integration\*.log" probe-out -ErrorAction SilentlyContinue
        Copy-Item "$env:LOCALAPPDATA\WinUIXamlPreview\preview.log" probe-out -ErrorAction SilentlyContinue
        $r = "$env:TEMP\wxp-vs-integration\results.log"
        $tail = if (Test-Path $r) {         (Get-Content $r -Tail 80) -join "`n" } else { "(no results.log)" }
                "### Full suite: ${{ steps.vsint.outcome }}`n``````n$tail`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY

    - name: Upload probe output
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: vs-probe-${{ matrix.os }}
        path: probe-out
        if-no-files-found: warn
        retention-days: 14
