name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # delete + save the VSIX size baseline cache on push to main

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install dependencies
      run: npm ci

    - name: Compile TypeScript
      run: npm run compile

    - name: Download CLI binaries
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: pwsh -NoProfile -File scripts/download-cli.ps1

    - name: Sync manifest schemas
      run: npm run sync-schemas

    - name: Lint
      run: npm run lint

    - name: Run unit tests
      run: npm run test:unit

    - name: Build XAML language server
      run: npm run build:server:debug

    - name: Run XAML language server tests
      run: npm run test:server

    - name: Publish self-contained XAML language servers
      run: npm run bundle:server

    - name: Run XAML LSP smoke test
      run: npm run test:xaml-smoke

    - name: Run self-contained XAML LSP smoke test
      env:
        WINUI_XAML_SERVER_PATH: ${{ github.workspace }}\dist\server\win-x64\WinUiXaml.LanguageServer.exe
      run: npm run test:xaml-self-contained

    - name: Run XAML integration tests
      env:
        WINUI_XAML_TEST_BUNDLED: "1"
      run: npm test

    - name: Download VS Code
      shell: pwsh
      run: |
        $vscodeVersion = "1.109.5"
        $vscodeDir = Join-Path $env:RUNNER_TEMP "vscode"
        $vscodeZip = Join-Path $env:RUNNER_TEMP "vscode.zip"
        Invoke-WebRequest `
          -Uri "https://update.code.visualstudio.com/$vscodeVersion/win32-x64-archive/stable" `
          -OutFile $vscodeZip `
          -UseBasicParsing
        Expand-Archive -Path $vscodeZip -DestinationPath $vscodeDir -Force

        $code = Join-Path $vscodeDir "Code.exe"
        if (-not (Test-Path $code)) {
          throw "Downloaded VS Code executable not found at $code"
        }
        "VSCODE_PATH=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Run E2E tests
      run: npm run test:e2e -- --grep-invert "adding empty custom capability|adding invalid format custom capability|adding valid custom capability|custom capability appears in the custom capabilities list|invalid inputFolder|cancelling the artifact QuickPick|selecting Browse|cancelling the certificate QuickPick"

    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          playwright-report
          test-results
        if-no-files-found: ignore
        retention-days: 7
    - name: Package VSIX
      run: pwsh -NoProfile -File scripts/package-vsc.ps1 -SkipServerBuild -CliBinariesPath bin

    - name: Validate bundled server in VSIX
      run: |
        $vsix = Get-ChildItem artifacts\*.vsix | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if (-not $vsix) { throw "Package script did not produce a VSIX." }
        pwsh -NoProfile -File scripts/validate-vsix-server.ps1 -VsixPath $vsix.FullName

    # --- VSIX size metrics ---
    # Measure the packaged VSIX so PRs can report the download size delta vs.
    # the main baseline. The `vsix` key is stable and is the allowlist key the
    # post-vsix-comment workflow renders.
    - name: Measure VSIX size
      run: |
        $vsix = Get-ChildItem artifacts\*.vsix | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if (-not $vsix) { throw "Package script did not produce a VSIX." }
        $bytes = $vsix.Length
        $sizes = [ordered]@{ vsix = $bytes }
        $sizes | ConvertTo-Json | Set-Content artifacts/vsix-sizes.json
        Write-Host "VSIX size: $([math]::Round($bytes / 1MB, 2)) MB ($bytes bytes)"

    - name: Upload VSIX artifact
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: vscode-extension
        path: artifacts/*.vsix
        if-no-files-found: error

    # On push to main, save the current VSIX size as the baseline future PRs
    # compare against. Caches are immutable, so delete the old entry first.
    - name: Prepare VSIX baseline
      if: github.ref == 'refs/heads/main'
      run: |
        New-Item -ItemType Directory -Path vsix-baseline -Force | Out-Null
        Copy-Item artifacts/vsix-sizes.json vsix-baseline/sizes.json -Force

    - name: Delete old VSIX baseline cache
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh cache delete "winappvsce-vsix-baseline" --repo $env:GITHUB_REPOSITORY 2>&1 | Out-Null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Old baseline cache deleted"
        } else {
          Write-Host "No existing baseline cache to delete (expected on first run)"
        }
        exit 0

    - name: Save VSIX baseline cache
      if: github.ref == 'refs/heads/main'
      uses: actions/cache/save@v6
      with:
        path: vsix-baseline
        key: winappvsce-vsix-baseline

    # On PRs, restore the baseline and stage current size + baseline + PR
    # context into a single `metrics-data` artifact. A separate workflow
    # (post-vsix-comment.yml, triggered by workflow_run) downloads it and posts
    # the comment. This split is required because PRs from forks don't grant
    # GITHUB_TOKEN write access during `pull_request`, but workflow_run runs in
    # the base repo with full write permissions.
    - name: Restore VSIX baseline cache
      if: github.event_name == 'pull_request'
      id: vsix-baseline
      uses: actions/cache/restore@v6
      with:
        path: vsix-baseline
        key: winappvsce-vsix-baseline

    - name: Stage VSIX metrics data
      if: github.event_name == 'pull_request'
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
      run: |
        $stage = "metrics-data"
        New-Item -ItemType Directory -Path $stage -Force | Out-Null
        # Current size (produced by the Measure VSIX size step)
        Copy-Item artifacts/vsix-sizes.json "$stage/vsix-sizes.json" -Force
        # Baseline (restored from cache above; missing on the first-ever PR)
        if (Test-Path vsix-baseline/sizes.json) {
          New-Item -ItemType Directory -Path "$stage/baseline" -Force | Out-Null
          Copy-Item vsix-baseline/sizes.json "$stage/baseline/sizes.json" -Force
        }
        # PR context (debug only — the post workflow re-derives PR identity from
        # workflow_run metadata for security; never trusts these fields).
        $ctx = [ordered]@{
          pr_number = [int]$env:PR_NUMBER
          head_sha  = $env:HEAD_SHA
          run_id    = [int64]$env:RUN_ID
        }
        $ctx | ConvertTo-Json | Set-Content "$stage/pr-context.json"
        # Fail loudly if the current size file is missing so we never publish an
        # empty report from the privileged post-vsix-comment workflow.
        if (-not (Test-Path "$stage/vsix-sizes.json")) {
          Write-Error "metrics staging is missing vsix-sizes.json. Did the Measure VSIX size step run?"
          exit 1
        }

    - name: Upload metrics-data artifact
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: metrics-data
        path: metrics-data
        if-no-files-found: error
        retention-days: 7

  test-arm64-server:
    runs-on: windows-11-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish native ARM64 language server
      run: |
        dotnet publish server\src\WinUiXaml.LanguageServer\WinUiXaml.LanguageServer.csproj -c Release -r win-arm64 --self-contained true -o dist\server\win-arm64
        dotnet publish server\src\WinUiXaml.DotnetHost\WinUiXaml.DotnetHost.csproj -c Release -r win-arm64 --self-contained true -o dist\server\win-arm64

    - name: Restore smoke fixture
      run: dotnet restore test\fixtures\xaml\fixture\SmokeFixture.csproj --configfile server\nuget.config

    - name: Run native ARM64 self-contained smoke
      env:
        WINUI_XAML_SERVER_PATH: ${{ github.workspace }}\dist\server\win-arm64\WinUiXaml.LanguageServer.exe
      run: node server\test\lsp-smoke\smoke.mjs
